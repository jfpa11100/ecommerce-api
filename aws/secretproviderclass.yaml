apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ecommerce-api-secrets
  namespace: default
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "ecommerce_db_secrets"
        objectType: "secretsmanager"
        jmesPath:
          - path: DATABASE_URL
            objectAlias: DATABASE_URL
          - path: OTEL_EXPORTER_OTLP_HEADERS
            objectAlias: OTEL_EXPORTER_OTLP_HEADERS
          - path: OTEL_EXPORTER_OTLP_ENDPOINT
            objectAlias: OTEL_EXPORTER_OTLP_ENDPOINT
  secretObjects:
  - secretName: ecommerce-api-secrets
    type: Opaque
    data:
    - objectName: DATABASE_URL
      key: DATABASE_URL
    - objectName: OTEL_EXPORTER_OTLP_HEADERS
      key: OTEL_EXPORTER_OTLP_HEADERS
    - objectName: OTEL_EXPORTER_OTLP_ENDPOINT
      key: OTEL_EXPORTER_OTLP_ENDPOINT
