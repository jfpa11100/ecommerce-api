apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-api
  template:
    metadata:
      labels:
        app: ecommerce-api
    spec:
      serviceAccountName: ecommerce-api
      containers:
        - name: ecommerce-api
          image: $account_id.dkr.ecr.us-east-2.amazonaws.com/ecommerce-api:v2.1.1
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: ecommerce-api-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: GCP_CLUSTER_URL
              value: "http://34.57.56.128"
            - name: OCI_CLUSTER_URL
              value: "http://20.232.234.128"
            - name: OTEL_SERVICE_NAME
              value: "api-aws"
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ecommerce-api-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-api
  namespace: default
spec:
  selector:
    app: ecommerce-api
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
