name: Chaos experiment

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Qué ejecutar"
        required: true
        type: choice
        options: [baseline, stop-tasks, header-fault]
        default: baseline
      p95_ms:
        description: "Umbral de p95 en ms para k6 (vacío = el del perfil)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_DIR: terraform

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: chaos

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - name: Terraform init y outputs
        run: |
          set -euo pipefail
          terraform -chdir=$TF_DIR init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          echo "BASE_URL=$(terraform -chdir=$TF_DIR output -raw api_url)" >> $GITHUB_ENV
          echo "ECS_CLUSTER=$(terraform -chdir=$TF_DIR output -raw ecs_cluster_name)" >> $GITHUB_ENV
          echo "ECS_SERVICE=$(terraform -chdir=$TF_DIR output -raw ecs_service_name)" >> $GITHUB_ENV
          echo "CHAOS_ALARM=$(terraform -chdir=$TF_DIR output -raw chaos_alarm_name)" >> $GITHUB_ENV
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "$(terraform -chdir=$TF_DIR output -raw chaos_token_secret_id)" \
            --query SecretString --output text)
          echo "::add-mask::$TOKEN"
          echo "CHAOS_TOKEN=$TOKEN" >> $GITHUB_ENV

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"

      - name: Instalar Chaos Toolkit
        run: pip install chaostoolkit==1.21.4

      - name: Lanzar k6 en segundo plano
        env:
          P95_MS: ${{ inputs.p95_ms }}
        run: |
          mkdir -p results
          ENABLE=false
          [ "${{ inputs.experiment }}" = "header-fault" ] && ENABLE=true
          P95_ARG=""
          [ -n "$P95_MS" ] && P95_ARG="-e P95_MS=$P95_MS"
          (
            set +e
            k6 run chaos/k6/load.js \
              -e BASE_URL=$BASE_URL -e CHAOS_TOKEN=$CHAOS_TOKEN -e ENABLE_FAULT=$ENABLE $P95_ARG \
              --summary-export results/k6-summary.json > results/k6.log 2>&1
            echo $? > results/k6.exit
          ) &

      - name: Baseline (3 min)
        if: inputs.experiment == 'stop-tasks'
        run: sleep 180

      - name: Experimento stop-tasks (Chaos Toolkit)
        if: inputs.experiment == 'stop-tasks'
        continue-on-error: true
        run: |
          chaos validate chaos/experiments/stop-tasks.json
          chaos run chaos/experiments/stop-tasks.json \
            --journal-path results/journal-stop-tasks.json

      - name: Esperar fin de k6
        if: always()
        run: |
          for i in $(seq 1 180); do          # máximo 15 minutos
            [ -f results/k6.exit ] && break
            sleep 5
          done

          if [ ! -f results/k6.exit ]; then
            echo "::error::k6 no terminó en 15 minutos"
            exit 1
          fi

          CODE=$(cat results/k6.exit)
          echo "k6 terminó con código $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::k6 terminó con código $CODE (99 = thresholds superados)"
            # exit "$CODE"   # descomenta para que el job falle si k6 falla
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-results
          path: results/